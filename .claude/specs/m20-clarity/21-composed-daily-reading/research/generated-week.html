const CHARTS = [["a", "Your chart"], ["u", "No birth time"]];
let chart = "a";
try { chart = localStorage.getItem("generated-week-chart") || "a"; } catch (error) { /* per-viewer convenience only */ }

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const words = (s) => s.trim().split(/\s+/).length;

function dayHTML(d) {
  const first = words(d.headline) + words(d.body) + words(d.agency);
  const cards = d.cards.map((c) => `<li><span class="k">${esc(c.kicker)}</span>${c.titles.map((t) => `<b>${esc(t)}</b>`).join("")}${c.line ? `<span>${esc(c.line)}</span>` : ""}</li>`).join("");
  const favors = d.suits.favors.length ? `<div class="chips"><span class="lean f">Favors</span>${d.suits.favors.map((x) => `<span class="chip f">${esc(x)}</span>`).join("")}</div>` : "";
  const watch = d.suits.watch.length ? `<div class="chips"><span class="lean w">Watch</span>${d.suits.watch.map((x) => `<span class="chip w">${esc(x)}</span>`).join("")}</div>` : "";
  const p = d.lead;
  return `<article class="day">
    <div class="meta"><span class="k">${esc(d.label)} · ${esc(d.pillar)}</span><span class="words">${first} words</span></div>
    <h2>${esc(d.headline)}</h2>
    <p>${esc(d.body)}</p>
    <div class="quote">${esc(d.agency)}</div>
    <span class="k">The rest of the day</span>
    <ul class="cards">${cards}</ul>
    <div class="suits"><span class="k">What the day suits</span><h3>${esc(d.suits.heading)}</h3>${favors}${watch}${d.suits.reason ? `<p style="color:var(--mut);font-size:14.5px">${esc(d.suits.reason)}</p>` : ""}</div>
    <details><summary>Read more: the reading's own page</summary>
      <div class="page"><h4>${esc(p.title)}</h4>${p.oldName ? `<p class="old">${esc(p.oldName)}</p>` : ""}
        ${p.forYou ? `<span class="k">For you today</span><p>${esc(p.forYou)}</p>` : ""}
        ${p.how.length ? `<span class="k">How it tends to go</span>${p.how.map((x) => `<p>${esc(x)}</p>`).join("")}` : ""}
        ${p.work.length ? `<span class="k">Working with it</span><ul>${p.work.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        <span class="k">Where the name comes from</span><p style="color:var(--mut)">${esc(p.nameOrigin)}</p></div>
    </details>
  </article>`;
}

function render() {
  const seg = document.getElementById("seg");
  seg.innerHTML = CHARTS.map(([k, label]) => `<button type="button" data-k="${k}" aria-pressed="${k === chart}">${label}</button>`).join("");
  seg.onclick = (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    chart = button.dataset.k;
    try { localStorage.setItem("generated-week-chart", chart); } catch (error) { /* per-viewer convenience only */ }
    render();
  };
  document.getElementById("days").innerHTML = WEEK[chart].map(dayHTML).join("");
}
render();
</script>
