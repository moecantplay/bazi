<title>Daymaster Composed Week</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: review notes on the left, a 390×844 phone on the right with the fold marked; the phone carries the app's own Trail tokens. */
:root {
  --c-bg: #EFE4D4; --c-ink: #2C2118; --c-mut: #6E5D4D; --c-card: #FBF4E8; --c-ring: rgba(44, 33, 24, .14); --c-flag: #B4531F;
  --f-display: "Bricolage Grotesque", system-ui, sans-serif;
  --f-body: Figtree, system-ui, sans-serif;
  --f-mono: "Space Mono", ui-monospace, monospace;
  --f-serif: ui-serif, "New York", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --c-bg: #110C09; --c-ink: #F0E5DA; --c-mut: #A89283; --c-card: #1F1813; --c-ring: rgba(240, 229, 218, .12); --c-flag: #EFA47C; }
}
:root[data-theme="dark"] { color-scheme: dark; --c-bg: #110C09; --c-ink: #F0E5DA; --c-mut: #A89283; --c-card: #1F1813; --c-ring: rgba(240, 229, 218, .12); --c-flag: #EFA47C; }

* { box-sizing: border-box; }
body { background: var(--c-bg); color: var(--c-ink); font: 15px/1.55 var(--f-body); margin: 0; padding-inline: 16px; }
button { font: inherit; color: inherit; }

.chrome { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--c-bg); padding-block: 12px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.chrome h1 { margin: 0 auto 0 0; font: 800 18px/1.2 var(--f-display); letter-spacing: -.01em; }
.seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 22px; background: var(--c-ring); }
.seg button { border: 0; background: transparent; font: 700 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 9px 11px; border-radius: 999px; cursor: pointer; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--c-card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg button:focus-visible { outline: 2px solid var(--c-ink); outline-offset: 2px; }

.stage { display: flex; gap: 40px; justify-content: center; align-items: flex-start; padding-block: 16px 56px; flex-wrap: wrap; }
.notes { width: 380px; max-width: 100%; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.notes h2 { margin: 0; font: 800 26px/1.1 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
.notes p { margin: 0; }
.box { background: var(--c-card); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.k { font: 700 10.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--c-mut); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.nums div { background: var(--c-card); padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.nums div:first-child { border-radius: 16px 4px 4px 16px; }
.nums div:last-child { border-radius: 4px 16px 16px 4px; }
.nums b { font: 800 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.nums b small { font: 700 11px var(--f-mono); color: var(--c-mut); }
.before-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--c-mut); }
.qs { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* ---------- Phone: Trail tokens ---------- */
.phone {
  --bg: #F6EBDC; --ink: #2C2118; --blk: #1D140C; --pale: #F6EBDC; --mut: #786655; --card: #FDF6EA; --card2: #F1E3CF;
  --line: rgba(104, 74, 48, .30); --faint: rgba(104, 74, 48, .16);
  --fr: #9A4323; --wd: #46672F; --am: #835D13;
  --field-fire: #EBC7B0; --field-earth: #EAD9B2; --field-metal: #E2DBD0; --field-water: #CBD8DC; --field-wood: #D5E1BE;
  --sh: 0 1px 2px rgba(60, 40, 20, .06), 0 10px 28px rgba(60, 40, 20, .09);
  width: 390px; max-width: 100%; border-radius: 46px; overflow: hidden; position: relative; flex: none;
  background: var(--bg); color: var(--ink); box-shadow: 0 0 0 10px #0E0A07, 0 30px 80px rgba(0, 0, 0, .28);
}
.phone[data-mode="dark"] {
  --bg: #1B1410; --ink: #F0E5DA; --blk: #F0E5DA; --pale: #1B1410; --mut: #A89283; --card: #271F18; --card2: #30261E;
  --line: rgba(230, 206, 186, .22); --faint: rgba(230, 206, 186, .11);
  --fr: #EFA47C; --wd: #ADCB96; --am: #DDB35E;
  --field-fire: #412718; --field-earth: #392D13; --field-metal: #2C2823; --field-water: #1C2A30; --field-wood: #2A3820;
  --sh: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .4);
}
.screen { position: relative; padding-bottom: 110px; }
.statusbar { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px; font: 600 15px var(--f-body); position: relative; z-index: 2; }
.fold { position: absolute; left: 0; right: 0; top: 844px; border-top: 2px dashed var(--c-flag); z-index: 6; pointer-events: none; }
.fold span { position: absolute; right: 10px; top: -22px; font: 700 9px var(--f-mono); letter-spacing: .1em; color: var(--c-flag); background: var(--bg); padding: 2px 6px; border-radius: 6px; }
.nav { position: sticky; bottom: 22px; margin: 24px 16px 22px; height: 60px; background: var(--blk); color: var(--pale); border-radius: 999px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; box-shadow: var(--sh); z-index: 5; }
.nav span { text-align: center; font: 700 9px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; opacity: .62; }
.nav span.on { opacity: 1; }

.pad { padding: 0 20px; display: flex; flex-direction: column; gap: 22px; }
.mono { font: 700 10px var(--f-mono); text-transform: uppercase; letter-spacing: .17em; }
.mut { color: var(--mut); }
.hl { margin: 0; font: 800 36px/1.06 var(--f-display); letter-spacing: -.022em; text-wrap: balance; }
.hl em { font: italic 500 1.02em var(--f-serif); letter-spacing: -.01em; }
.body { margin: 0; font-size: 16px; line-height: 1.62; }
.datenav { display: inline-flex; align-items: center; gap: 4px; }
.datenav i { font-style: normal; color: var(--mut); font: 400 18px var(--f-body); }

.quote { position: relative; background: var(--blk); color: var(--pale); border-radius: 28px; padding: 30px 24px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.quote::before { content: "\201C"; position: absolute; left: 14px; top: -18px; font: italic 500 110px/1 var(--f-serif); color: color-mix(in srgb, var(--pale) 22%, var(--blk)); }
.quote p { position: relative; margin: 0; font: italic 500 25px/1.2 var(--f-serif); letter-spacing: -.01em; text-wrap: balance; }
.quote .mono { color: color-mix(in srgb, var(--pale) 72%, var(--blk)); }

.section-k { display: flex; align-items: center; gap: 10px; color: var(--mut); }
.section-k::before { content: ""; width: 16px; height: 2px; background: currentColor; }

/* details: Explorer = waypoint list */
.trail { display: flex; flex-direction: column; gap: 0; position: relative; }
.trail::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; border-left: 2px dashed var(--line); }
.wp { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 8px 0; position: relative; }
.wp i { width: 24px; height: 24px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--ink); display: grid; place-items: center; }
.wp i::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.wp .mono { color: var(--mut); font-size: 9.5px; }
.wp b { display: block; font: 800 17px/1.25 var(--f-display); letter-spacing: -.01em; }
.wp span.g { display: block; color: var(--mut); font-size: 14px; }

/* details: Editorial = tonal segment stack */
.stack { display: flex; flex-direction: column; gap: 2px; }
.row { background: var(--card); padding: 13px 18px; display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: baseline; }
.row:first-child { border-radius: 20px 20px 6px 6px; }
.row:last-child { border-radius: 6px 6px 20px 20px; }
.row .mono { color: var(--mut); font-size: 9.5px; letter-spacing: .12em; }
.row b { font: 800 16px/1.3 var(--f-display); letter-spacing: -.01em; }
.row span.g { display: block; color: var(--mut); font-size: 14px; line-height: 1.45; }
.row > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }

/* details: Instrument = readout tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--card); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile.wide { grid-column: 1 / -1; }
.tile .mono { color: var(--mut); font-size: 9px; letter-spacing: .14em; }
.tile b { font: 800 16px/1.25 var(--f-display); letter-spacing: -.01em; }
.sn { font: 600 14.5px var(--f-body); color: var(--ink); }
.old { display: block; font: 700 9px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mut); margin-top: 2px; }
.stars { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.star { display: flex; flex-direction: column; }
.tile span.g { color: var(--mut); font-size: 13px; line-height: 1.4; }

/* what the day suits */
.suits { background: var(--card); border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.suits h3 { margin: 0; font: 800 18px/1.2 var(--f-display); letter-spacing: -.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 600 13px var(--f-body); padding: 7px 12px; border-radius: 999px; background: var(--card2); }
.chip.fav { box-shadow: inset 0 0 0 2px var(--wd); }
.chip.watch { box-shadow: inset 0 0 0 2px var(--am); }
.lean { font: 700 9.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; width: 58px; }
.lean.fav { color: var(--wd); }
.lean.watch { color: var(--am); }
.why { margin: 0; font-size: 14px; color: var(--mut); }
.find { font-size: 13px; color: var(--mut); }

/* the way into the detail page, and the page itself */
.depth-link { all: unset; box-sizing: border-box; cursor: pointer; background: var(--card); border-radius: 22px; padding: 16px 44px 16px 18px; display: flex; flex-direction: column; gap: 4px; position: relative; min-height: 64px; }
.depth-link b { font: 800 18px/1.25 var(--f-display); letter-spacing: -.01em; }
.depth-link .g { color: var(--mut); font-size: 14px; }
.depth-link .chev { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font: 400 24px var(--f-body); color: var(--mut); }
.depth-link:focus-visible, .back:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.back { all: unset; cursor: pointer; align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; font: 700 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.depth-head { display: flex; flex-direction: column; gap: 10px; }
.depth-head .body { margin: 0; }

/* current version */
.old-rest { display: flex; flex-direction: column; gap: 10px; }
.old-rest p { margin: 0; background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }

/* ---------- heroes (simplified; unchanged by this ticket) ---------- */
.ex-hero { position: relative; margin-top: -50px; padding-top: 56px; min-height: 470px; overflow: hidden; }
.ex-hero svg.topo { position: absolute; inset: 0; width: 100%; height: 100%; }
.ex-top { position: relative; display: flex; justify-content: space-between; padding: 0 20px; }
.ex-hero .hl { position: relative; padding: 14px 20px 0; font-size: 36px; }
.ex-route { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; width: 100%; }

.ed-field { position: relative; margin-top: -50px; padding: 62px 22px 22px; border-radius: 0 0 34px 34px; height: 330px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.ed-mast { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
.ed-no { font: 800 64px/.9 var(--f-display); letter-spacing: -.04em; }
.ed-animal { position: absolute; right: -12px; bottom: 40px; font: 800 118px/1 var(--f-display); letter-spacing: -.05em; opacity: .9; }
.ed-foot { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 4px; }

.in-top { display: flex; justify-content: space-between; padding: 6px 20px 0; }
.in-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 16px 16px 0; }
.in-week div { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.in-week b { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; font: 700 13px var(--f-mono); }
.in-week div.on b { background: var(--ink); color: var(--bg); box-shadow: none; }
.in-week span { font: 700 8.5px var(--f-mono); letter-spacing: .1em; color: var(--mut); }
.in-dial { display: grid; place-items: center; padding: 18px 0 6px; }
.in-dial svg { width: 290px; height: 290px; max-width: 100%; }
.legend { display: flex; gap: 18px; padding: 0 20px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; font: 700 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.legend i { width: 18px; height: 7px; border-radius: 4px; }

@media (max-width: 460px) {
  .phone { border-radius: 30px; box-shadow: 0 0 0 6px #0E0A07; }
  .fold { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .42s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--d, 0) * 70ms); }
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
</style>

  u: [

      why: ["The goat meets the rat", "Today's sign, the goat, is at odds with the rat, your birth chart's sign for work.", "Harm"],
      also: [], element: ELEMENT.against("Fire"), tg: "Direct Resource", stage: "Decline", stars: ["Nobleman", "Taiji Nobleman"],
      favors: ["Launches", "Moving", "Learning"], watch: ["Clearing out"], whyWatch: WHY.open },
    { headline: "Help is closer than it feels today.",
      body: "Work and home are on the same side today, even if the day feels heavy. You may be tempted to push through alone. The people around you would rather help than watch you struggle.",
      agency: "Ask for help with one thing you'd normally carry alone.",
      lead: "Trine across work and home", mod: "Earth works against you",
      why: ["The monkey completes a set", "Today's sign, the monkey, makes a set of three with the rat and dragon, your chart's signs for work and home.", "Trine"],
      also: [], element: null, tg: "Friend", stage: "Illness", stars: ["Virtue's Companion", "Scholar", "Travel Horse"],
      favors: ["Rest"], watch: ["Commitments", "Launches", "Moving"], whyWatch: WHY.close },
    { headline: "Old family habits rub a little today.",
      body: "A familiar family pattern may grate today: the same question, the same tone, the same small argument. It's easy to let it slide. Naming it to yourself, even silently, keeps it from building.",

      lead: "Harm in the family", mod: null,
      why: ["The rooster meets the dog", "Today's sign, the rooster, is at odds with the dog, your birth chart's sign for family.", "Harm"],
      also: [ALSO.homeCombine], element: ELEMENT.against("Earth"), tg: "Rob Wealth", stage: "Stillness", stars: ["Peach Blossom"],
      favors: ["Travel", "Learning", "The big ask"], watch: ["Clearing out"], whyWatch: WHY.establish },
    { headline: "Home has two plans for one evening. You can sort it.",
      body: "You and the person closest to you may want different things from tonight. You're thinking clearly today, so you're well placed to lay out both options calmly and choose together.",
      agency: "Suggest a middle way for tonight before anyone digs in.",

      also: [], element: null, tg: "Eating God", stage: "Storage", stars: ["Taiji Nobleman", "Canopy", "Void"],
      favors: ["Clearing out", "Rest"], watch: [], whyWatch: null },
    { headline: "A quiet day with room for one clever workaround.",
      body: "Nothing pulls hard on you today, which leaves room to be inventive. You're likely to spot the shortcut others miss. You're thinking clearly too, so a sharp idea lands well if you say it kindly.",
      agency: "Suggest one better way to do a routine task, and keep it short.",
      lead: "Hurting Officer day (no sign pulls today)", mod: "Metal suits you",
      why: ["A quiet day for your chart", "None of today's signs pull on your chart's four signs, so the day's character leads.", "Hurting Officer"],
      also: [], element: null, tg: null, stage: "Severance", stars: ["Heavenly Joy", "Void"],
      favors: ["Launches", "Deals & paperwork", "Gatherings"], watch: [], whyWatch: null },
    { headline: "Home feels like a team today.",
      body: "You and the people closest to you pull the same way today, without needing to talk it through. Plans you make together now tend to hold, so it's a good day to settle something you've been circling.",
      agency: "Plan one thing for the weekend with the person closest to you.",
      lead: "Trine at home", mod: null,
      why: ["The rat lines up with the dragon", "Today's sign, the rat, lines up with the dragon, your birth chart's sign for home and partner.", "Trine"],
      also: [], element: ELEMENT.suits("Water"), tg: "Indirect Wealth", stage: "Conception", stars: ["Monthly Virtue", "General", "Flying Blade", "Calamity", "Mourning Gate"],
      favors: ["Deals & paperwork", "Gatherings"], watch: [], whyWatch: null },
  ],
};

const state = { chart: "a", version: "new", look: "trail", mode: "light", day: 0, page: "today" };
try {
  const saved = JSON.parse(localStorage.getItem("composed-week") || "{}");
  Object.assign(state, saved);
} catch (error) { /* per-viewer convenience only */ }

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const words = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);

/* Mirrors presentation/today-screen.ts headlineRuns: plain frame, emphasised middle. */
function headlineHTML(text) {
  const w = text.split(" ");
  if (w.length < 5) return esc(text);
  const start = Math.max(1, Math.floor(w.length * 0.4));
  const end = w.length - 1;
  return `${esc(w.slice(0, start).join(" "))} <em>${esc(w.slice(start, end).join(" "))}</em> ${esc(w.slice(end).join(" "))}`;
}

/* Each item: kicker, plain title, one plain sentence (optional), old name (optional). */
function details(r, d) {
  const items = [{ k: "Why today", t: r.why[0], g: r.why[1], old: r.why[2] }];
  for (const [t, g] of r.also) items.push({ k: "Also today", t, g, old: null });
  if (r.element) items.push({ k: "The day's element", t: r.element[0], g: r.element[1], old: null });
  const tg = r.tg ? TG[r.tg] : r.tgPlain;
  if (tg) items.push({ k: "The day's character", t: tg[0], g: tg[1], old: null });
  items.push({ k: "Hours", t: `Easiest ${d.easy[1]}`, g: `Roughest ${d.rough[1]}`, old: null });
  items.push({ k: "Your pace", t: STAGE[r.stage][0], g: STAGE[r.stage][1], old: null });
  items.push({ k: "Small signs", stars: r.stars });
  return items;
}

function itemWords(it) {
  if (it.stars) return it.stars.reduce((n, s) => n + words(STAR[s]) + words(s), 0);
  return words(it.t) + words(it.g || "") + words(it.old || "");
}

function oldTag(old) {
  return old ? `<span class="old">Old name · ${esc(old)}</span>` : "";
}

function itemBody(it) {
  if (it.stars) {
    return `<div class="stars">${it.stars.map((s) => `<span class="star"><strong class="sn">${esc(STAR[s])}</strong></span>`).join("")}</div>`;
  }
  return `<b>${esc(it.t)}</b>${it.g ? `<span class="g">${esc(it.g)}</span>` : ""}${oldTag(it.old)}`;
}

function detailsHTML(r, d, look) {
  const items = details(r, d);
  if (look === "trail") {
    return `<div class="trail">${items.map((it) => `
      <div class="wp"><i></i><div><span class="mono">${esc(it.k)}</span>${itemBody(it)}</div></div>`).join("")}</div>`;
  }
  if (look === "almanac") {
    return `<div class="stack">${items.map((it) => `
      <div class="row"><span class="mono">${esc(it.k)}</span><div>${itemBody(it)}</div></div>`).join("")}</div>`;
  }
  const isWide = (it) => it.k !== "Hours" && it.k !== "Your pace";
  return `<div class="tiles">${items.map((it) =>
    `<div class="tile${isWide(it) ? " wide" : ""}"><span class="mono">${esc(it.k)}</span>${itemBody(it)}</div>`).join("")}</div>`;
}

function suitsHTML(r, d) {
  const favors = r.favors.length ? `<div class="chips"><span class="lean fav">Favors</span>${r.favors.map((c) => `<span class="chip fav">${esc(c)}</span>`).join("")}</div>` : "";
  const watch = r.watch.length ? `<div class="chips"><span class="lean watch">Watch</span>${r.watch.map((c) => `<span class="chip watch">${esc(c)}</span>`).join("")}</div><p class="why">${esc(r.whyWatch)}</p>` : "";
  return `<div class="suits"><span class="mono mut">What the day suits</span><div><h3>${esc(d.officer[0])}</h3>${oldTag(d.officer[1])}</div>${favors}${watch}<span class="find">Find a day for something →</span></div>`;
}

function topo() {
  let paths = "";
  for (let i = 0; i < 9; i += 1) {
    const r = 40 + i * 34;
    paths += `<ellipse cx="${250 + i * 6}" cy="${150 + i * 4}" rx="${r * 1.25}" ry="${r * 0.8}" fill="none" stroke="var(--faint)" stroke-width="1.5" transform="rotate(${-12 + i * 3} 250 150)"/>`;
  }
  return `<svg class="topo" viewBox="0 0 390 470" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${paths}</svg>`;
}

function mark(x, y, label, kind, time) {
  const ring = kind === "easy" ? "var(--wd)" : "var(--am)";
  return `<g><circle cx="${x}" cy="${y}" r="20" fill="var(--card)" stroke="${ring}" stroke-width="4"/>
    <text x="${x}" y="${y + 4}" text-anchor="middle" font-family="Space Mono, monospace" font-weight="700" font-size="9" fill="var(--ink)">${esc(label.slice(0, 3).toUpperCase())}</text>
    <text x="${Math.min(300, Math.max(80, x))}" y="${y - 30}" text-anchor="middle" font-family="Space Mono, monospace" font-weight="700" font-size="10" letter-spacing="1.5" fill="var(--ink)">${kind.toUpperCase()} · ${esc(time.toUpperCase())}</text></g>`;
}

function routeX(hour) { const h = (hour + 24 - 5) % 24; return 30 + (h / 21) * 320; }

function heroHTML(d, r, look) {
  const hl = `<h1 class="hl rise">${headlineHTML(r.headline)}</h1>`;
  const date = `<span class="datenav mono"><i>‹</i>${esc(d.label)}<i>›</i></span>`;
  if (look === "trail") {
    const ex = routeX(d.easy[2]), rx = routeX(d.rough[2]);
    const y = (x) => 150 - (x - 30) * 0.28;
    return `<div class="ex-hero">${topo()}<div class="ex-top">${date}<span class="mono mut">${esc(d.pillar)}</span></div>
      <div style="position:relative;padding:0">${hl.replace('class="hl', 'class="hl" style="padding:14px 20px 0;font-size:36px" data-x="')}</div>
      <svg class="ex-route" viewBox="0 0 390 170" aria-hidden="true">
        <path d="M30 150 L 360 58" stroke="var(--ink)" stroke-width="4" stroke-dasharray="8 7" fill="none"/>
        ${mark(ex, y(ex), d.easy[0], "easy", d.easy[1])}${mark(rx, y(rx), d.rough[0], "rough", d.rough[1])}
        <text x="30" y="166" font-family="Space Mono, monospace" font-weight="700" font-size="9" letter-spacing="2" fill="var(--mut)">MORNING</text>
        <text x="360" y="84" text-anchor="end" font-family="Space Mono, monospace" font-weight="700" font-size="9" letter-spacing="2" fill="var(--mut)">EVENING</text>
      </svg></div>`;
  }
  if (look === "almanac") {
    return `<div class="ed-field" style="background:var(--field-${d.elem})"><div class="ed-mast"><span class="ed-no">${d.doy}</span>${date}</div>
      <span class="ed-animal" aria-hidden="true">${esc(d.animal)}</span>
      <div class="ed-foot"><span class="mono">Day ${d.doy} of the year</span><span class="mono">${esc(d.pillar)}</span></div></div>
      <div class="pad" style="padding-top:24px">${hl.replace('class="hl', 'style="font-size:40px;line-height:1.02" class="hl')}</div>`;
  }
  const week = DAYS.map((x, i) => `<div class="${i === state.day ? "on" : ""}"><b>${Number(x.date.slice(8))}</b><span>${x.dow.toUpperCase()}</span></div>`).join("");
  const arc = (hour, color) => {
    const a0 = ((hour / 24) * 360 - 90 + 180) * Math.PI / 180, a1 = (((hour + 2) / 24) * 360 - 90 + 180) * Math.PI / 180;
    const R = 110, cx = 145, cy = 145;
    return `<path d="M ${cx + R * Math.cos(a0)} ${cy + R * Math.sin(a0)} A ${R} ${R} 0 0 1 ${cx + R * Math.cos(a1)} ${cy + R * Math.sin(a1)}" stroke="${color}" stroke-width="16" stroke-linecap="round" fill="none"/>`;
  };
  return `<div class="in-top">${date}<span class="mono mut">${esc(d.pillar)}</span></div><div class="in-week">${week}</div>
    <div class="in-dial"><svg viewBox="0 0 290 290" aria-hidden="true">
      <circle cx="145" cy="145" r="110" stroke="var(--faint)" stroke-width="16" fill="none"/>
      ${arc(d.easy[2], "var(--wd)")}${arc(d.rough[2], "var(--am)")}
      <circle cx="145" cy="145" r="52" fill="var(--card)"/>
      <text x="145" y="150" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="20" fill="var(--ink)">${esc(d.animal)}</text>
      <text x="145" y="26" text-anchor="middle" font-family="Space Mono, monospace" font-size="9" letter-spacing="2" fill="var(--mut)">NOON</text>
      <text x="145" y="272" text-anchor="middle" font-family="Space Mono, monospace" font-size="9" letter-spacing="2" fill="var(--mut)">MIDNIGHT</text>
    </svg></div>
    <div class="legend"><span><i style="background:var(--wd)"></i>Easy ${esc(d.easy[1])}</span><span><i style="background:var(--am)"></i>Rough ${esc(d.rough[1])}</span></div>
    <div class="pad" style="padding-top:20px">${hl}</div>`;
}

const DEPTH_TITLE = { trail: "Along the way", almanac: "Notes on the day", dial: "Readings" };

function depthLinkHTML(d) {
  return `<button type="button" class="depth-link" data-go="depth"><span class="mono mut">${esc(DEPTH_TITLE[state.look])}</span><b>What's behind ${esc(d.label.split(", ")[1])}</b><span class="g">The signs, the hours, your pace and the day's character, laid out in full.</span><span class="chev" aria-hidden="true">›</span></button>`;
}

function depthHTML() {
  const d = DAYS[state.day];
  const r = AFTER[state.chart][state.day];
  return `<div class="screen"><div class="statusbar"><span>9:41</span><span>●●●</span></div>
    <div class="pad" style="padding-top:8px">
      <button type="button" class="back" data-go="today">‹ Today</button>
      <div class="depth-head"><span class="mono mut">${esc(DEPTH_TITLE[state.look])} · ${esc(d.label)}</span>
        <h1 class="hl" style="font-size:34px">What's behind today</h1>
        <p class="body mut" style="font-size:15px">Your reading for ${esc(d.label.split(", ")[1])}, taken apart: what in your chart set it off, and everything else the day carries.</p></div>
      ${detailsHTML(r, d, state.look)}
      <span class="find">How this reading works →</span>
    </div>
    <nav class="nav" aria-label="App tabs (static)"><span>Chart</span><span class="on">Today</span><span>Cycles</span><span>Compare</span><span>Settings</span></nav></div>`;
}

function phoneHTML() {
  if (state.page === "depth" && state.version === "new") return depthHTML();
  const d = DAYS[state.day];
  const fresh = state.version === "new";
  const r = fresh ? AFTER[state.chart][state.day] : null;
  const b = BEFORE[state.chart][state.day];
  const headline = fresh ? r.headline : b.headline;
  const hero = heroHTML(d, { headline }, state.look);
  const bodyText = fresh ? r.body : b.grain;
  const agency = fresh ? r.agency : b.agency;
  const top = `<p class="body rise" style="--d:2">${esc(bodyText)}</p>
    <div class="quote rise" style="--d:3"><span class="mono">One thing to do</span><p>${esc(agency)}</p></div>`;
  const rest = fresh
    ? `${suitsHTML(r, d)}${depthLinkHTML(d)}`
    : `<p class="mono section-k" style="margin:0">The rest of the day, as it ships now</p><div class="old-rest">${b.rest.map((line) => `<p>${esc(line)}</p>`).join("")}</div>`;
  return `<div class="fold"><span>FOLD · 844 PX</span></div>
    <div class="screen"><div class="statusbar"><span>9:41</span><span>●●●</span></div>
    ${hero}
    <div class="pad" style="padding-top:22px">${top}${rest}</div>
    <nav class="nav" aria-label="App tabs (static)"><span>Chart</span><span class="on">Today</span><span>Cycles</span><span>Compare</span><span>Settings</span></nav></div>`;
}

function notesHTML() {
  const d = DAYS[state.day];
  const r = AFTER[state.chart][state.day];
  const b = BEFORE[state.chart][state.day];
  const firstNew = words(r.headline) + words(r.body) + words(r.agency);
  const firstOld = words(b.headline) + words(b.grain) + words(b.agency);
  const detailWords = details(r, d).reduce((n, it) => n + itemWords(it), 0);
  const totalOld = firstOld + b.rest.reduce((n, line) => n + words(line), 0);
  const chartName = state.chart === "a" ? "your chart (Fixture A)" : "the no-birth-time chart";
  return `
    <h2>${esc(d.label)}, ${esc(chartName)}</h2>
    <div class="nums">
      <div><span class="k">First screen</span><b>${firstNew}<small> words</small></b><span class="k">now ${firstOld}</span></div>
      <div><span class="k">Detail page</span><b>${detailWords}<small> words</small></b><span class="k">now all on Today: ${totalOld}</span></div>
      <div><span class="k">Budget</span><b>70<small> words</small></b><span class="k">proposed</span></div>
    </div>
    <div class="box"><span class="k">What leads, and why</span>
      <p><b>${esc(r.lead)}</b> is the strongest fact today, so the first screen is about it and nothing else repeats it.</p>
      <p>${r.mod ? `<b>${esc(r.mod)}</b> joins the body because it changes the advice.` : "The element agrees with the lead, so it stays in the details."}</p>
      <p>Today says how the day could go and what helps. Everything else, including the one old name under <b>Why today</b>, is on the detail page behind the link.</p>
    </div>
    <div class="box"><span class="k">Now, below the first screen</span>
      <ul class="before-list">${b.rest.slice(0, 4).map((line) => `<li>${esc(line)}</li>`).join("")}<li>…and ${Math.max(0, b.rest.length - 4)} more lines. Switch Version to “Now” to see the whole screen.</li></ul>
    </div>
    <div class="box"><span class="k">For you to decide</span>
      <ol class="qs">
        <li>Is the link card the right way in, and is its wording clear?</li>
        <li>Does the detail page read well in each look? Open it from the card or the Screen switch.</li>
      </ol>
      <p class="k" style="text-transform:none;letter-spacing:0;font:400 12.5px var(--f-body)">Hero art is simplified here; this ticket doesn't change it.</p>
    </div>`;
}

function segment(id, key, options) {
  const el = document.getElementById(id);
  el.innerHTML = options.map(([value, label]) => `<button type="button" data-v="${value}" aria-pressed="${String(state[key]) === String(value)}">${esc(label)}</button>`).join("");
  el.onclick = (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    state[key] = key === "day" ? Number(button.dataset.v) : button.dataset.v;
    try { localStorage.setItem("composed-week", JSON.stringify(state)); } catch (error) { /* per-viewer convenience only */ }
    render();
  };
}

function render() {
  segment("seg-chart", "chart", [["a", "Your chart"], ["u", "No birth time"]]);
  segment("seg-version", "version", [["new", "Composed"], ["old", "Now"]]);
  segment("seg-look", "look", [["trail", "Explorer"], ["almanac", "Editorial"], ["dial", "Instrument"]]);
  segment("seg-mode", "mode", [["light", "Light"], ["dark", "Dark"]]);
  segment("seg-page", "page", [["today", "Today"], ["depth", "What's behind it"]]);
  segment("seg-day", "day", DAYS.map((d, i) => [i, `${d.dow} ${Number(d.date.slice(8))}`]));
  const phone = document.getElementById("phone");
  phone.dataset.mode = state.mode;
  phone.innerHTML = phoneHTML();
  phone.onclick = (event) => {
    const go = event.target.closest("[data-go]");
    if (!go) return;
    state.page = go.dataset.go;
    if (state.page === "depth") state.version = "new";
    try { localStorage.setItem("composed-week", JSON.stringify(state)); } catch (error) { /* per-viewer convenience only */ }
    render();
    phone.scrollIntoView({ block: "start", behavior: "smooth" });
  };
  document.getElementById("notes").innerHTML = notesHTML();
}
render();
</script>
